<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a78d6">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pari Passu">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Pari Passu Investments</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="loginForm" class="card login-card" autocomplete="off">
      <h1>Pari Passu Investments</h1>
      <p class="muted">Sign in with your name and the personal passcode you were given.</p>
      <label for="loginName">Your name</label>
      <input id="loginName" name="username" type="text" autocomplete="username" placeholder="Leave blank if you are the admin">
      <label for="passcode">Passcode</label>
      <input id="passcode" name="passcode" type="password" autocomplete="current-password" required>
      <p id="loginError" class="error" role="alert"></p>
      <button id="retryBtn" class="btn" type="button" hidden>Try again</button>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
  </section>

  <div id="app" hidden>
    <div id="ptr" class="ptr" aria-hidden="true"><span>↻</span></div>
    <header class="titlebar">
      <button id="reloadBtn" class="titlebtn" type="button" aria-label="Refresh the app" title="Refresh">↻</button>
      <img class="logo" src="/icons/icon.svg" alt="" width="44" height="44">
      <h1 class="title">Pari Passu Investments</h1>
      <p class="tagline">Power Lunch Club &amp; individual investments</p>
    </header>
    <div class="navbar">
      <nav id="tabs" aria-label="Sections">
        <a href="#overview" data-tab="overview">Overview</a>
        <a href="#people" data-tab="people">People</a>
        <a href="#deals" data-tab="deals">Deals</a>
        <a href="#yearend" data-tab="yearend">Year-end</a>
        <a href="#mydeals" data-tab="mydeals">My deals</a>
        <a href="#admin" data-tab="admin" id="adminTab" hidden>Manage</a>
      </nav>
      <div class="actions">
        <div id="previewWrap" class="previewwrap" hidden><label for="previewSel">Preview as</label><select id="previewSel"></select></div>
        <button id="addInvBtn" class="btn primary small" type="button" hidden>+ Add investment</button>
        <div class="actions-sub">
          <span id="roleBadge" class="badge"></span>
          <button id="installBtn" class="btn small" type="button" hidden>Install app</button>
          <button id="themeBtn" class="btn ghost" type="button" aria-label="Switch to dark mode">☾ Dark mode</button>
          <button id="logoutBtn" class="btn ghost" type="button">Sign out</button>
        </div>
      </div>
    </div>
    <div id="previewBar" class="previewbar" role="status" hidden></div>
    <div id="scopeBar" class="scopebar" role="radiogroup" aria-label="Which investments to show"></div>
    <main id="view" tabindex="-1"></main>
  </div>

  <div id="tip" class="tip" role="tooltip" hidden></div>
  <dialog id="dlg"></dialog>
  <dialog id="wiz" class="wiz" aria-label="Guided questions"></dialog>
  <script src="/app.js" defer></script>
  <script src="/wizard.js" defer></script>
</body>
</html>
